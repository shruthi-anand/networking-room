<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4efe7" />
    <title>Networking Room | Shruthi Anand</title>
    <link rel="stylesheet" href="./css/style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main id="app" aria-label="Shruthi Anand's networking room">
      <div class="scene-ui">
        <p class="eyebrow">Interactive introduction</p>
        <h1>Networking</h1>
        <p id="status" class="status">Drag to look around. Choose a ball to connect.</p>
      </div>
      <div id="loading" class="loading" aria-live="polite">Loading room...</div>
      <div id="notebook-dialog" class="dialog" hidden>
        <button id="close-notebook" class="icon-button" type="button" aria-label="Close notebook">&times;</button>
        <p class="eyebrow">Leave a message</p>
        <h2>Say hello to Shruthi</h2>
        <form id="message-form">
          <label for="message">Your message</label>
          <textarea id="message" name="message" rows="4" required></textarea>
          <input class="honeypot" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" />
          <button type="submit">Send message</button>
        </form>
      </div>
    </main>
    <script type="module" src="./js/scene.js"></script>
  </body>
</html>
