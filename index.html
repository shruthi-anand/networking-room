<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Net-Work Room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&display=swap" />
    <link rel="stylesheet" href="./css/style.css" />
    <!-- Vercel Web Analytics: queue stub + script (served by Vercel once Web Analytics is enabled for the project). -->
    <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
    <script defer src="/_vercel/insights/script.js"></script>
    <script type="importmap">
      { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      } }
    </script>
  </head>
  <body class="is-loading">
    <canvas id="stage" aria-label="Grid room with a basketball hoop and two floating balls, LinkedIn and WhatsApp. Drag or swipe to look around."></canvas>
    <button class="look-hint is-open is-drawing" id="lookHint" type="button" data-mode="drag" aria-live="polite">
      <span class="look-hint__icon" aria-hidden="true">
        <svg viewBox="0 0 32 32">
          <g class="glyph glyph--tilt"><g class="tilt-phone"><rect class="draw" pathLength="1" x="11" y="7" width="10" height="18" rx="2.6"/><path class="draw" pathLength="1" d="M15 22.2h2"/></g><path class="draw" pathLength="1" d="M6.5 12.5a11 11 0 0 0 0 9"/><path class="draw" pathLength="1" d="M25.5 12.5a11 11 0 0 1 0 9"/></g>
          <g class="glyph glyph--swipe"><path class="draw" pathLength="1" d="M8 13l-3 3 3 3"/><path class="draw" pathLength="1" d="M24 13l3 3-3 3"/><g class="swipe-finger"><circle class="draw" pathLength="1" cx="16" cy="16" r="3.2"/><circle class="draw" pathLength="1" cx="16" cy="16" r="6.2" opacity="0.4"/></g></g>
          <g class="glyph glyph--drag"><path class="draw" pathLength="1" d="M7 25.5h18M9.5 23l-2.5 2.5 2.5 2.5M22.5 23l2.5 2.5-2.5 2.5"/><g class="pan-hand"><path class="draw" pathLength="1" d="M11.5 16V8.5a1.5 1.5 0 0 1 3 0V13V6.5a1.5 1.5 0 0 1 3 0V13V8a1.5 1.5 0 0 1 3 0v7.5l1.2-1.2a1.4 1.4 0 0 1 2 2l-3.7 4.2A5 5 0 0 1 16.3 22H15a5 5 0 0 1-4.7-3.3L9 15.8a1.4 1.4 0 0 1 2.5-1.1Z"/></g></g>
        </svg>
      </span>
      <span class="look-hint__text"><span class="look-hint__title" id="lookHintTitle">Drag to look around</span><span class="look-hint__sub" id="lookHintSub"></span></span>
    </button>
    <div class="hud" id="hud">
      <div class="bio-ticker" id="bioTicker" hidden>
        <p class="bio-ticker__text"><span class="sr-only" id="bioTickerFull"></span><span aria-hidden="true"><span id="bioTickerTyped"></span><span class="bio-ticker__caret"></span><span class="bio-ticker__rest" id="bioTickerRest"></span></span></p>
      </div>
      <div class="scoreboard" id="scoreboard" role="status" aria-label="Score">
        <div class="scoreboard__name" id="scoreboardName"></div>
        <div class="scoreboard__score"><span class="scoreboard__value" id="scoreboardValue">0</span></div>
      </div>
    </div>
    <h1 class="page-title" id="pageTitle"><span class="page-title__glow">Let's <span class="title-solid">Net</span>-Work</span></h1>
    <p class="shoot-nudge" id="shootNudge" aria-hidden="true"><span></span></p>
    <div class="shot-prompt" id="shotPrompt" hidden>
      Easy Shot
    </div>
    <div class="connect-hint" id="connectHint" hidden>
      <span>Swipe up to connect</span>
      <svg viewBox="0 0 32 48" aria-hidden="true">
        <path class="connect-arrow" d="M16 42V9m0 0-6 7m6-7 6 7" />
        <path class="connect-finger" d="M12 31V17a2 2 0 0 1 4 0v8V11a2 2 0 0 1 4 0v14-9a2 2 0 0 1 4 0v10l1.5-1.5a2 2 0 0 1 3 2.7l-5.4 6.2A7 7 0 0 1 18 36h-1a7 7 0 0 1-6.2-3.8L9 29a2 2 0 0 1 3-2Z" />
        <path class="connect-index" d="M13.5 33V15a2.5 2.5 0 0 1 5 0v10a2.2 2.2 0 0 1 4.4 0v1a2.2 2.2 0 0 1 4.4 0v5.5a8 8 0 0 1-8 8h-2a7 7 0 0 1-6-3.5l-2.6-4.6a2 2 0 0 1 3.3-2.2l1.5 2Z" />
      </svg>
    </div>
    <div class="message-sheet" id="messageSheet" hidden role="dialog" aria-modal="true" aria-labelledby="messageTitle">
      <form class="message-card" id="messageForm" novalidate>
        <div class="message-card__head">
          <h2 class="message-card__title" id="messageTitle"></h2>
          <button class="message-card__close" id="messageClose" type="button" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </div>
        <div class="message-card__fields">
          <div class="message-card__field">
            <label class="message-card__label" for="messageName" id="messageNameLabel"></label>
            <input class="message-card__input" id="messageName" name="name" type="text" autocomplete="name" maxlength="120" required aria-describedby="messageStatus" />
          </div>
          <div class="message-card__field">
            <label class="message-card__label" for="messageContact" id="messageContactLabel"></label>
            <input class="message-card__input" id="messageContact" name="contact" type="text" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" maxlength="200" required aria-describedby="messageStatus" />
          </div>
          <div class="message-card__field">
            <label class="message-card__label" for="messageText" id="messageTextLabel"></label>
            <textarea class="message-card__input message-card__text" id="messageText" name="message" rows="3" maxlength="2000"></textarea>
          </div>
        </div>
        <!-- Honeypot: real visitors never see or reach this; bots that fill it are dropped (Formspree _gotcha). -->
        <div class="message-card__hp" aria-hidden="true"><label>Leave this empty <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" /></label></div>
        <input type="hidden" name="_subject" />
        <input type="hidden" name="_replyto" />
        <input type="hidden" name="event" />
        <div class="message-card__foot">
          <p class="message-card__status" id="messageStatus" role="status" aria-live="polite"></p>
          <button class="message-card__send" id="messageSend" type="submit"></button>
        </div>
      </form>
    </div>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
